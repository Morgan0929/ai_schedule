version: "3.9"

services:
  # ============ PostgreSQL 16 ============
  postgres:
    image: postgres:16-alpine
    container_name: ai-schedule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_schedule_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-schedule-network

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: ai-schedule-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-schedule-network

  # ============ Qdrant 向量数据库 ============
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-schedule-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-schedule-network

volumes:
  postgres_data:
    name: ai_schedule_postgres_data
  redis_data:
    name: ai_schedule_redis_data
  qdrant_data:
    name: ai_schedule_qdrant_data

networks:
  ai-schedule-network:
    name: ai-schedule-network
    driver: bridge
